; comfyaim: one chat room for players on any server. Type /aim <text> in game.
;
; Lives in the client folder next to WoW.exe. Changes take effect when the client starts.
;
; nick, secret and realm are written by comfyaim. The secret proves the nick is yours: keep it, and do
; not share it. A copy of this file in a second client folder signs on as the same person.

[hub]
enabled = 1
url     = wss://comfycraft.dedyn.io/aim
nick=
secret=
realm=

[general]
log         = 1
hook        = 1       ; 0 = load but patch nothing, for bisecting problems
chainWaitMs = 10000   ; wait this long for comfygrass / comfyfog / comfytime to finish attaching first
